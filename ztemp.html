<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notebook with Quill and DataTables</title>
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      .notebook {
        position: relative;
        width: 60vw;
        height: 80vh;
        perspective: 1500px;
        background: #f0f0f0;
      }
      .cover,
      .page-container {
        width: 100%;
        height: 100%;
        position: absolute;
        background: #fff;
        border: 2px solid #999;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        transform-style: preserve-3d;
        transform-origin: left;
        transition: transform 1s;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .cover {
        background: #d3d3d3;
        z-index: 2;
        transform: rotateY(0deg);
      }
      .cover.open {
        transform: rotateY(-180deg);
      }
      .cover::before {
        content: "Open Notebook";
        font-size: 24px;
        color: #333;
      }
      .page-container {
        z-index: 1;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        background: #f0f0f0;
      }
      .page-container.open {
        transform: rotateY(0deg);
      }
      .page-wrapper {
        display: flex;
        transition: transform 1s;
        width: 100%;
        height: calc(100% - 50px);
      }
      .page {
        width: 100%;
        height: 100%;
        display: none;
      }
      .page.active {
        display: block;
      }
      .quill-container {
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        overflow: auto;
        background: repeating-linear-gradient(
          to bottom,
          #fff,
          #fff 1px,
          #eee 1px,
          #eee 20px
        );
      }
      .pagination-controls {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        position: absolute;
        width: 100%;
        bottom: 10px;
        box-sizing: border-box;
        padding: 0 20px;
      }
      .pagination-controls button {
        padding: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 50%;
        cursor: pointer;
      }
      .pagination-controls button:hover {
        background: #0056b3;
      }
      .pagination-controls button i {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="notebook">
      <div class="cover" id="cover"></div>
      <div class="page-container" id="page-container">
        <div class="page-wrapper" id="page-wrapper">
          <!-- Pages will be appended here -->
        </div>
        <div class="pagination-controls">
          <button id="prev-page"><i class="fas fa-chevron-left"></i></button>
          <button id="add-page"><i class="fas fa-plus"></i></button>
          <button id="next-page"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
      $(document).ready(function () {
        let pageCount = 0;
        const quillEditors = [];
        const pageWrapper = $("#page-wrapper");

        function createPage() {
          const pageNumber = ++pageCount;
          const pageDiv = $('<div class="page active"></div>'); // New page with 'active' class
          const quillContainer = $(
            '<div class="quill-container"></div>'
          ).appendTo(pageDiv);
          const quillEditor = new Quill(quillContainer[0], {
            theme: "snow",
            modules: {
              toolbar: [
                [{ header: [1, 2, false] }],
                ["bold", "italic", "underline"],
                [{ list: "ordered" }, { list: "bullet" }],
                ["link"],
                ["clean"],
              ],
            },
            placeholder: "Write your thoughts here...",
          });

          quillEditors.push(quillEditor);
          pageWrapper.append(pageDiv);

          // Manage active state for pages
          $(".page").removeClass("active"); // Remove active class from other pages
          pageDiv.addClass("active"); // Add active class to the new page

          return pageDiv;
        }

        // Initialize the first page
        createPage();

        // Add Page functionality
        $("#add-page").on("click", function () {
          createPage();
        });

        // Handle page navigation
        $("#prev-page").on("click", function () {
          const activePage = $(".page.active");
          const prevPage = activePage.prev(".page");
          if (prevPage.length) {
            const pageWidth = activePage.outerWidth();
            activePage.removeClass("active");
            prevPage.addClass("active");
            pageWrapper.css(
              "transform",
              `translateX(-${pageWidth * prevPage.index()}px)`
            );
          }
        });

        $("#next-page").on("click", function () {
          const activePage = $(".page.active");
          const nextPage = activePage.next(".page");
          if (nextPage.length) {
            const pageWidth = activePage.outerWidth();
            activePage.removeClass("active");
            nextPage.addClass("active");
            pageWrapper.css(
              "transform",
              `translateX(-${pageWidth * nextPage.index()}px)`
            );
          }
        });

        // Handle cover flip
        $("#cover").on("click", function () {
          $(this).toggleClass("open");
          $("#page-container").toggleClass("open");
        });
      });
    </script>
  </body>
</html>
